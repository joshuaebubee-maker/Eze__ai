name: Build EZE Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Executable
        run: chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Debug APK Exists
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Debug APK built successfully at app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "ERROR: Debug APK not found!"
            exit 1
          fi

      - name: Upload EZE Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZE-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
